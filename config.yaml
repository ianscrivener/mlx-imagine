mflux_config:
  default_quantize: 8
  allowed_quantize: "q3 q4 q5 q6 q8 bf16"

mflux_models:
  local_directory: /Volumes/Extreme2Tb/MFlux-Models
  allow_download: true
  allow_delete: true
  max_models: 10
  max_size_gb: 150
  remote_url: https://huggingface.co/mflux-community
  cron_minutes: 5

huggingface_models:
  local_directory: /Volumes/Crucial500Gb/HUGGINGFACE_HUB_ACTIVE
  allow_hf_access: true
  allow_model_download: false
  require_model_confirmation: true
  allow_delete: true
  max_models: 10
  max_size_gb: 150
  cron_minutes: 5

data_directory: ./data

image_directories:
  input: ./input
  # output: ./output
  # output: /Volumes/Extreme2Tb/AI_images_M4/___MFlux_Inbox
  output: /Volumes/Extreme2Tb/AI_images_M4/___MFlux_Inbox/Hermes_Staging
  max_upload_mb: 50

image_metadata:
  iptc_enabled: false
  exif_enabled: false
  json_sidecar_enabled: true

services:
  api_enable: true
  mcp_enable: true
  swagger_enable: true

server:
  host: 127.0.0.1
  port: 8765
  require_api_token: false
  api_token: your_api_token_here
  use_tls: false


# The Mac has 36 GB of RAM. mx.set_memory_limit does not stop swap growth, so watch the memory during a run.
memory_limit_gb: 28

queue:
  queue_max_length: 100
  job_history: 200


# MLX keeps freed buffers for reuse. One 512x512 image left 14.8 GB in this cache without a limit.
cache_limit_gb: 4
