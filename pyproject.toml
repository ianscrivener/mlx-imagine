[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
default-excludes = true
module-name = "mlx_imagine"

[project]
name = "mlx-imagine"
version = "0.0.1"
description = "A long-running HTTP and MCP server for mflux image models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ian Scrivener" }]
maintainers = [{ name = "Ian Scrivener" }]
requires-python = ">=3.12"
keywords = ["mflux", "mlx", "apple-silicon", "diffusion", "server", "mcp"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # A floor only: the first mflux whose command steps mlx-imagine calls. tests/test_mflux_drift.py and the
    # `just mflux-bump` check find a breaking mflux release.
    "mflux>=0.23",
    "fastapi>=0.140",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "mcp>=2.3",
    # Pillow 13.0.0 imports numbers._IntegralLike, which CPython 3.13.5 does not have.
    "pillow>=12.3,<13",
    "pyyaml>=6.0",
    "toml>=0.10.2",
]

[project.scripts]
mlx-imagine = "mlx_imagine.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1,<10.0",
    "ruff==0.16.3",
    "ty==0.0.72",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
respect-gitignore = true
# Vendored skill. Keep it the same as the upstream skill.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["BLE", "E4", "E7", "E9", "F", "I", "ICN", "LOG", "PERF", "W"]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets HF_HUB_OFFLINE / HF_HOME before importing anything that reads them.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
known-first-party = ["mlx_imagine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
